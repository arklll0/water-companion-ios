name: Build iOS IPA

# 只有 iPhone、没有 Mac 时的构建路径：
# 推送到 main 或手动触发 → GitHub 的 macOS 机器编译 → 下载未签名 IPA → 用 Sideloadly 装进 iPhone。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 提前把工程结构打印出来：如果 scheme 名字不对，这一步就能看出来，
      # 不用等到 archive 跑到一半才报错（失败一次要多等十分钟）。
      - name: Verify scheme
        run: xcodebuild -project WaterCompanion.xcodeproj -list

      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -project WaterCompanion.xcodeproj \
            -scheme WaterCompanion \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WaterCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/WaterCompanion.xcarchive/Products/Applications/WaterCompanion.app build/Payload/
          cd build
          zip -qry WaterCompanion-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaterCompanion-unsigned-ipa
          path: build/WaterCompanion-unsigned.ipa
          if-no-files-found: error
