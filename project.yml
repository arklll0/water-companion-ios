name: WaterCompanion

options:
  bundleIdPrefix: com.shuiban
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    # ⚠️ SWIFT_VERSION 是**语言模式**，不是编译器版本。
    # 写 "5.9" 会让 xcodebuild 直接报 unsupported（只支持 4.0 / 4.2 / 5.0）。
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 最小并发检查：可变状态的类已全部标 @MainActor，
    # 不需要 strict 模式额外那一堆「跨隔离传值」的要求。
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  WaterCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # 源代码：按目录加入，XcodeGen 递归收集 .swift
      - path: Sources/WaterCompanion
      # 内容 JSON：group 型，逐个进 Copy Bundle Resources，最终落在 bundle 根目录
      # （ContentStore 的路径查找对「拍平」和「保留子目录」两种结果都做了兜底）
      - path: Resources/Content
        type: group
        buildPhase: resources
      # App 图标：Assets.xcassets 里只有 AppIcon.appiconset，
      # 界面上的图标一律走 SF Symbols，没有图片图标。
      # 注意：.xcassets 必须交给 XcodeGen 默认处理（编译成 Assets.car），
      # 不能用 type: group + buildPhase: resources，否则内部两个 Contents.json
      # 会被平铺拷进 bundle 根目录重名冲突，报 "Multiple commands produce Contents.json"。
      - path: Resources/Assets.xcassets
      # 音频：folder reference（蓝色文件夹），整个 Audio/ 原样拷进 bundle，
      # 运行期路径是 Audio/<file>.m4a。
      # 用 folder 而不是 group 是因为这里有 3000+ 个文件 —— 逐个进
      # PBXBuildFile 会让工程文件膨胀到几十 MB、编译也慢一个量级。
      - path: Resources/Audio
        type: folder
        buildPhase: resources
    # Info.plist 交给 XcodeGen 生成（Windows 上不落盘，CI 的 macOS 上生成）。
    # ★ UIBackgroundModes: audio —— 没有它，锁屏或切到后台时音频会被系统立刻掐断，
    #   「边走路边听」这个核心场景就断了。
    info:
      # 放在仓库根目录：Sources/ 整个目录会被当源码/资源收集，
      # Info.plist 若落在 Sources 里会同时被拷进 bundle，产生「两个 Info.plist」的警告。
      path: Info.plist
      properties:
        CFBundleDisplayName: 水伴英语
        CFBundleName: WaterCompanion
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UIUserInterfaceStyle: Automatic

    settings:
      base:
        PRODUCT_NAME: WaterCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.shuiban.english
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # 资产目录里只有 AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
